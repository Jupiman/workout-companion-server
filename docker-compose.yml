services:
  workout-companion:
    build: .
    image: workout-companion-server:local
    container_name: workout-companion
    environment:
      ASPNETCORE_URLS: http://+:8080
      WORKOUT_API_TOKEN: ${WORKOUT_API_TOKEN:-}
      TZ: ${TZ:-Europe/Prague}
    ports:
      - "8080:8080"
    volumes:
      - workout-data:/data
    healthcheck:
      test: ["CMD", "dotnet", "WorkoutCompanion.Server.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  workout-data:
